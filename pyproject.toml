[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groovefetch"
version = "0.1.0"
description = "AI-native adaptive web scraper with schema validation and RAG pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "GrooveXlabs", email = "beingeonic@gmail.com"}
]
keywords = ["web-scraping", "ai", "rag", "stealth", "crawler", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx[http2]>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.7.0",
    "playwright>=1.43.0",
    "fake-useragent>=1.5.0",
    "aiofiles>=23.0.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
rag = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
]
agent = [
    "openai>=1.30.0",
    "anthropic>=0.28.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "respx>=0.21.0",
]

[project.scripts]
groovefetch = "groovefetch.cli:main"

[project.urls]
Homepage = "https://github.com/GrooveXlabs/groovefetch"
Repository = "https://github.com/GrooveXlabs/groovefetch"
Issues = "https://github.com/GrooveXlabs/groovefetch/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["groovefetch*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
